packages:
  - 'apps/*'
  - 'packages/*'

# Read by pnpm 10.26+ and 11, which run no dependency build scripts unless they
# are approved here. The pinned pnpm 9 ignores this key and runs them all, so
# these keep pnpm 11 doing what pnpm 9 already does.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  node-pty: true
  simple-git-hooks: true
  vue-demi: true
