name: Update Homebrew

# Writes the formula for `brew install nubisco/tap/openbridge` into the
# nubisco/homebrew-tap repository, from the latest release on npm.
#
# Not chained to Publish to npm on purpose. Homebrew installs npm packages with
# --min-release-age=1, refusing anything published in the last day, so a
# formula for a release made an hour ago fails for everyone who installs it
# until the day is up. A daily run picks each release up once it is old enough,
# and a release that is followed by a fix the same day never reaches Homebrew.
#
# The formula comes from scripts/homebrew-formula.mjs. The push uses
# HOMEBREW_TAP_TOKEN, a fine-grained token that can write the tap's contents and
# nothing else.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  formula:
    name: Update the formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/checkout@v7
        with:
          repository: nubisco/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pick the release
        id: pick
        # The newest release that is at least a day old, not `latest`. With a release a
        # day for a week, `latest` was always too young at run time, and the tap stood
        # still at the last version that had happened to be old enough.
        run: |
          set -euo pipefail
          current=$(sed -n 's/^  url ".*openbridge-\([0-9.]*\)\.tgz"$/\1/p' tap/Formula/openbridge.rb 2>/dev/null || true)
          curl -fsS https://registry.npmjs.org/@nubisco/openbridge > meta.json
          node - "$current" <<'JS' >> "$GITHUB_OUTPUT"
          const fs = require('fs')
          const meta = JSON.parse(fs.readFileSync('meta.json', 'utf8'))
          const current = process.argv[2] || ''
          const parse = (v) => v.split('.').map(Number)
          const newer = (a, b) => { const [x, y] = [parse(a), parse(b)]; for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false }
          // A day plus an hour, so the formula never lands just inside Homebrew's cutoff.
          const cutoff = Date.now() - 90_000 * 1000
          const eligible = Object.entries(meta.time)
            .filter(([v, at]) => /^\d+\.\d+\.\d+$/.test(v) && Date.parse(at) <= cutoff)
            .map(([v]) => v)
            .sort((a, b) => (newer(a, b) ? -1 : newer(b, a) ? 1 : 0))
          const pick = eligible[0]
          const latest = meta['dist-tags'].latest
          console.error(`latest ${latest}, newest eligible ${pick ?? 'none'}, tap has ${current || 'nothing'}`)
          const update = Boolean(pick) && (!current || newer(pick, current))
          if (!update) console.error(pick ? 'the tap is current' : 'nothing is a day old yet')
          console.log(`update=${update}`)
          console.log(`version=${pick ?? ''}`)
          JS

      - name: Write the formula
        if: steps.pick.outputs.update == 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          sha=$(curl -fsSL "https://registry.npmjs.org/@nubisco/openbridge/-/openbridge-$VERSION.tgz" | sha256sum | cut -d' ' -f1)
          node scripts/homebrew-formula.mjs "$VERSION" "$sha" > tap/Formula/openbridge.rb
          cat tap/Formula/openbridge.rb

      - name: Push to the tap
        if: steps.pick.outputs.update == 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/openbridge.rb
          git commit -m "openbridge $VERSION"
          git push origin HEAD
