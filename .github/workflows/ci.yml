name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    # A hung step should fail with a readable log rather than occupy a runner
    # until the six-hour default. Ten minutes is ample: a green run takes 90s.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Built separately: the docs site is memory-hungry and must never be able to
      # abort the runtime build (see README "Building on low-memory machines").
      - name: Build docs
        run: pnpm build:docs

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
